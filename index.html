<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidey Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <!-- Font Awesome-->
     <script src="https://kit.fontawesome.com/50bffcd4b6.js" crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar">
    <div class="logo-container">
        <img src="img/spider-logo-v1.png" alt="Logo" class="logo">
    </div>
    <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/pages/journal.html">Journal</a></li>
        <li><a href="/pages/projects.html">Projects</a></li>
        <li><a href="/pages/skills.html">Skills</a></li>
        <li><a href="/pages/tasks.html">Missions</a></li>
    </ul>
</nav>
<section class="mainSection" id="mainSection">
<div class="heading-container">
    <h1 class="mainHeader">Spidey</h1>
    <div class="underline"></div>
    <h1 class="subHeader">Tracker</h1>
    <div class="underline2"></div>
</div>
</section>

<!-- Spidey Level-->
<section id="dashboard" class="dashboard">
    <div class="xpContainer">
        <h1 class="xpHeader">Spidey Level</h1>
        <h2 class="xpLevel">1</h2>
        <div class="xpBar">
            <progress id="xpProgress" value="26" max="100"></progress>
        </div>
        <h2 class="xpValue">26/100</h2>
    </div>
</section>
<!-- End of Spidey Level-->

<!-- Spidey Identity-->
 <section id="identity" class="identity">
    <div class="identityContainer">
        <div class="spideyInformation col-md-6 col-sm-12">
            <img src="img/spider-logo-v1.png" alt="Spidey Avatar" class="spideyAvatar">

        </div>
        <div class="spideyIdentity col-md-6 col-sm-12">
            <h1 class="spideyHeading"> Lucan Cowell</h1>
            <div class="spideyStats">
            <h2> Fitness: </h2>
            <div class="star">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>
            <h2> Academics: </h2>
            <div class="star">
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>
            <h2> Creativity: </h2>
            <div class="star">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>
            <h2> Programming: </h2>
            <div class="star">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>
            </div>
        </div>
    </div>
<!-- End of Spidey Identity-->

</body>
</html>
